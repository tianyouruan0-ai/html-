<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据展示</title>
    <style>
        /* ================= Apple 官网字体栈（与工作台一致） ================= */
        :root {
            --font-apple: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont,
                          "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0071e3;
            --bg-page: #f5f5f7;
            --card-border: #e8e8ed;
            --green: #34c759;
            --red: #ff3b30;
            --orange: #ff9500;
            --purple: #af52de;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: var(--font-apple);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-size: 17px;
            line-height: 1.47;
            letter-spacing: -0.01em;
            min-height: 100vh;
            padding: 32px 48px 48px;
        }

        /* ================= 顶部导航 ================= */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.015em;
        }

        .page-header h1 .sub {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: var(--accent-blue);
            color: #fff;
            border-radius: 980px;        /* Apple 胶囊按钮圆角 */
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .back-link:hover {
            background: #0077ed;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.35);
        }

        /* ================= KPI 指标卡 ================= */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 22px 24px;
            animation: fadeUp 0.5s ease backwards;
        }

        .kpi-card:nth-child(1) { animation-delay: 0.05s; }
        .kpi-card:nth-child(2) { animation-delay: 0.12s; }
        .kpi-card:nth-child(3) { animation-delay: 0.19s; }
        .kpi-card:nth-child(4) { animation-delay: 0.26s; }

        .kpi-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .kpi-delta {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 980px;
        }

        .kpi-delta.up   { color: #1d8042; background: rgba(52, 199, 89, 0.12); }
        .kpi-delta.down { color: #c9302c; background: rgba(255, 59, 48, 0.10); }

        /* ================= 图表卡片 ================= */
        .chart-grid {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 18px;
            margin-bottom: 24px;
        }

        .chart-grid-2 {
            display: grid;
            grid-template-columns: 2fr 3fr;
            gap: 18px;
        }

        .chart-card {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            animation: fadeUp 0.5s ease backwards;
        }

        .chart-card.trend { animation-delay: 0.33s; }
        .chart-card.donut { animation-delay: 0.40s; }
        .chart-card.channel { animation-delay: 0.47s; }

        .chart-card h2 {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .chart-card .chart-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* 折线图 */
        .line-chart svg { width: 100%; height: auto; display: block; }

        .line-path {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            animation: drawLine 1.4s 0.5s ease forwards;
        }

        @keyframes drawLine { to { stroke-dashoffset: 0; } }

        .area-path { animation: fadeIn 1s 0.9s ease backwards; }

        .dot-point { animation: fadeIn 0.4s ease backwards; }

        /* 环形图 */
        .donut-wrap {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .donut-center-val {
            font-size: 22px;
            font-weight: 700;
            fill: var(--text-primary);
        }

        .donut-center-label {
            font-size: 11px;
            font-weight: 500;
            fill: var(--text-secondary);
        }

        .legend { flex: 1; }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #f0f0f2;
            font-size: 14px;
        }

        .legend-item:last-child { border-bottom: none; }

        .legend-item .li-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        .legend-val { font-weight: 600; font-variant-numeric: tabular-nums; }

        /* 条形图 */
        .bar-row { margin-bottom: 16px; }

        .bar-row:last-child { margin-bottom: 0; }

        .bar-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13.5px;
            margin-bottom: 7px;
        }

        .bar-meta .bar-name { font-weight: 500; }

        .bar-meta .bar-val {
            color: var(--text-secondary);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .bar-track {
            height: 12px;
            background: #ececf0;
            border-radius: 980px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 980px;
            width: 0;
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            body { padding: 24px; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-grid, .chart-grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ================= 顶部导航 ================= -->
    <header class="page-header">
        <h1>
            数据展示
            <span class="sub" id="updateTime">数据更新于 --</span>
        </h1>
        <a class="back-link" href="app.html">← 返回工作台</a>
    </header>

    <!-- ================= KPI 指标卡 ================= -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-label">今日访问量</div>
            <div class="kpi-value" id="kpiVisits">--</div>
            <div class="kpi-delta up">▲ 8.2% 较昨日</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">今日销售额</div>
            <div class="kpi-value" id="kpiSales">--</div>
            <div class="kpi-delta up">▲ 5.6% 较昨日</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">新增用户</div>
            <div class="kpi-value" id="kpiUsers">--</div>
            <div class="kpi-delta up">▲ 12.3% 较昨日</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">支付转化率</div>
            <div class="kpi-value" id="kpiRate">--</div>
            <div class="kpi-delta down">▼ 0.4% 较昨日</div>
        </div>
    </div>

    <!-- ================= 近7天趋势 + 用户来源占比 ================= -->
    <div class="chart-grid">
        <div class="chart-card trend">
            <h2>近 7 天访问量趋势</h2>
            <div class="chart-desc">单位：次 · 每日 0 点更新</div>
            <div class="line-chart" id="trendChart"></div>
        </div>

        <div class="chart-card donut">
            <h2>用户来源占比</h2>
            <div class="chart-desc">统计周期：最近 30 天</div>
            <div class="donut-wrap">
                <svg id="donutChart" width="180" height="180" viewBox="0 0 180 180"></svg>
                <div class="legend" id="donutLegend"></div>
            </div>
        </div>
    </div>

    <!-- ================= 渠道对比 + 促销活动转化 ================= -->
    <div class="chart-grid-2">
        <div class="chart-card donut">
            <h2>周目标完成度</h2>
            <div class="chart-desc">本周销售目标 ¥100,000</div>
            <div class="donut-wrap">
                <svg id="goalChart" width="180" height="180" viewBox="0 0 180 180"></svg>
                <div class="legend">
                    <div class="legend-item">
                        <div class="li-left"><div class="legend-dot" style="background:var(--accent-blue);"></div>已完成</div>
                        <div class="legend-val" id="goalDone">--</div>
                    </div>
                    <div class="legend-item">
                        <div class="li-left"><div class="legend-dot" style="background:#d2d2d7;"></div>剩余</div>
                        <div class="legend-val" id="goalLeft">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-card channel">
            <h2>渠道访问量对比</h2>
            <div class="chart-desc">今日各渠道带来的访问量（次）</div>
            <div id="barChart"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 说明：所有图表均使用原生 SVG / DOM 绘制，
        //       不依赖任何外部图表库，离线也可正常显示。
        // ==========================================

        // ---------- 1. KPI 数字滚动动画 ----------
        function animateNumber(el, target, duration, formatter) {
            const start = performance.now();
            function tick(t) {
                const p = Math.min((t - start) / duration, 1);
                const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
                el.textContent = formatter(Math.round(target * eased));
                if (p < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        const fmtInt = n => n.toLocaleString('zh-CN');
        const fmtMoney = n => '¥' + n.toLocaleString('zh-CN');

        animateNumber(document.getElementById('kpiVisits'), 12847, 1200, fmtInt);
        animateNumber(document.getElementById('kpiSales'), 86430, 1200, fmtMoney);
        animateNumber(document.getElementById('kpiUsers'), 1024, 1200, fmtInt);
        animateNumber(document.getElementById('kpiRate'), 38, 1200, n => (n / 10).toFixed(1) + '%');

        // 更新时间戳
        (function setUpdateTime() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('updateTime').textContent =
                `数据更新于 ${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        })();

        // ---------- 2. 近 7 天趋势折线图（SVG） ----------
        (function renderTrend() {
            const W = 640, H = 260, PAD_L = 46, PAD_R = 16, PAD_T = 18, PAD_B = 34;
            const days = ['6天前', '5天前', '4天前', '3天前', '前天', '昨天', '今天'];
            // 演示数据：近 7 天访问量（可替换为后端接口返回的真实数据）
            const values = [8600, 9400, 8900, 10300, 9800, 11800, 12847];
            const maxV = Math.max(...values) * 1.15;
            const minV = 0;

            const x = i => PAD_L + i * (W - PAD_L - PAD_R) / (values.length - 1);
            const y = v => PAD_T + (H - PAD_T - PAD_B) * (1 - (v - minV) / (maxV - minV));

            let gridLines = '';
            // 横向网格 + 纵轴刻度
            for (let g = 0; g <= 4; g++) {
                const gv = minV + (maxV - minV) * g / 4;
                const gy = y(gv);
                gridLines += `
                    <line x1="${PAD_L}" y1="${gy}" x2="${W - PAD_R}" y2="${gy}"
                          stroke="#ececf0" stroke-width="1"/>
                    <text x="${PAD_L - 8}" y="${gy + 4}" text-anchor="end"
                          font-size="11" fill="#86868b">${Math.round(gv / 1000)}k</text>`;
            }

            // 折线路径与面积路径
            let line = '', area = '';
            values.forEach((v, i) => {
                line += (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
            });
            area = line + `L ${x(values.length - 1).toFixed(1)} ${y(minV)} L ${x(0)} ${y(minV)} Z`;

            // 数据点与数值标签
            let dots = '';
            values.forEach((v, i) => {
                const isLast = i === values.length - 1;
                dots += `
                    <circle class="dot-point" cx="${x(i)}" cy="${y(v)}" r="${isLast ? 6 : 4}"
                            fill="${isLast ? '#0071e3' : '#fff'}"
                            stroke="#0071e3" stroke-width="2.5"
                            style="animation-delay:${0.5 + i * 0.12}s"/>
                    ${isLast ? `<text x="${x(i)}" y="${y(v) - 14}" text-anchor="middle"
                                      font-size="13" font-weight="700" fill="#0071e3">${v.toLocaleString()}</text>` : ''}
                `;
            });

            // 横轴日期标签
            let xLabels = '';
            days.forEach((d, i) => {
                xLabels += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle"
                                   font-size="12" fill="#86868b">${d}</text>`;
            });

            document.getElementById('trendChart').innerHTML = `
                <svg viewBox="0 0 ${W} ${H}">
                    <defs>
                        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#0071e3" stop-opacity="0.22"/>
                            <stop offset="100%" stop-color="#0071e3" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                    ${gridLines}
                    <path class="area-path" d="${area}" fill="url(#areaGrad)"/>
                    <path class="line-path" d="${line}"/>
                    ${dots}
                    ${xLabels}
                </svg>`;
        })();

        // ---------- 3. 环形图绘制工具 ----------
        function renderDonut(svgId, segments, centerTop, centerBottom, animateDelay) {
            const svg = document.getElementById(svgId);
            const CX = 90, CY = 90, R = 66, SW = 22;
            const C = 2 * Math.PI * R;
            let offset = C * 0.25; // 从 12 点方向开始
            let rings = '';

            // 底环
            rings += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none"
                              stroke="#ececf0" stroke-width="${SW}"/>`;

            segments.forEach((seg, i) => {
                const len = C * seg.pct;
                rings += `
                    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none"
                            stroke="${seg.color}" stroke-width="${SW}"
                            stroke-dasharray="${len} ${C - len}"
                            stroke-dashoffset="${offset}"
                            stroke-linecap="butt"
                            style="animation: fadeIn .5s ${(animateDelay || 0) + i * 0.15}s ease backwards;">
                        <title>${seg.name}：${Math.round(seg.pct * 100)}%</title>
                    </circle>`;
                offset -= len;
            });

            rings += `
                <text class="donut-center-val" x="${CX}" y="${CY + 2}" text-anchor="middle">${centerTop}</text>
                <text class="donut-center-label" x="${CX}" y="${CY + 24}" text-anchor="middle">${centerBottom}</text>`;

            svg.innerHTML = rings;
        }

        // 用户来源占比
        const sourceData = [
            { name: '直接访问', pct: 0.38, color: '#0071e3' },
            { name: '搜索引擎', pct: 0.27, color: '#34c759' },
            { name: '社交媒体', pct: 0.20, color: '#ff9500' },
            { name: '邮件推广', pct: 0.15, color: '#af52de' }
        ];
        renderDonut('donutChart', sourceData, '100%', '来源合计', 0.5);

        document.getElementById('donutLegend').innerHTML = sourceData.map(s => `
            <div class="legend-item">
                <div class="li-left"><div class="legend-dot" style="background:${s.color};"></div>${s.name}</div>
                <div class="legend-val">${Math.round(s.pct * 100)}%</div>
            </div>`).join('');

        // 周目标完成度：86.4%
        const goalPct = 0.864;
        renderDonut('goalChart', [{ name: '已完成', pct: goalPct, color: '#0071e3' }],
                    Math.round(goalPct * 100) + '%', '本周完成', 0.6);
        document.getElementById('goalDone').textContent = fmtMoney(86430);
        document.getElementById('goalLeft').textContent = fmtMoney(100000 - 86430);

        // ---------- 4. 渠道访问量条形图 ----------
        (function renderBars() {
            const channels = [
                { name: '直接访问', value: 4882, color: '#0071e3' },
                { name: '搜索引擎', value: 3469, color: '#34c759' },
                { name: '社交媒体', value: 2569, color: '#ff9500' },
                { name: '邮件推广', value: 1927, color: '#af52de' },
                { name: '其他来源', value: 1284, color: '#8e8e93' }
            ];
            const maxV = Math.max(...channels.map(c => c.value));
            const wrap = document.getElementById('barChart');

            wrap.innerHTML = channels.map((c, i) => `
                <div class="bar-row">
                    <div class="bar-meta">
                        <span class="bar-name">${c.name}</span>
                        <span class="bar-val" id="barVal${i}">0</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" data-value="${c.value}" data-max="${maxV}"
                             data-color="${c.color}" data-idx="${i}"
                             style="background:${c.color};"></div>
                    </div>
                </div>`).join('');

            // 延迟触发，让条形以动画方式生长
            setTimeout(() => {
                wrap.querySelectorAll('.bar-fill').forEach(fill => {
                    fill.style.width = (fill.dataset.value / fill.dataset.max * 100) + '%';
                    animateNumber(document.getElementById('barVal' + fill.dataset.idx),
                                  Number(fill.dataset.value), 1000, fmtInt);
                });
            }, 400);
        })();
    </script>
</body>
</html>
