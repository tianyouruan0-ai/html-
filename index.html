<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>动态登录页面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-page">
        <!-- ============ 左侧蓝色弧形品牌面板 ============ -->
        <aside class="panel-left">
            <div class="brand-title">NFT前端工程师<span class="accent">bilibili</span></div>

            <div class="panel-slogan">
                <h3>New here ?</h3>
                <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.<br>Debitis, ex ratione. Aliquid!</p>
                <button type="button" class="signup-btn" id="signupBtn">SIGN UP</button>
            </div>

            <!-- 火箭 + 人物插画（手绘 SVG） -->
            <div class="panel-illustration">
                <svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <!-- 地面阴影 -->
                    <ellipse cx="220" cy="278" rx="150" ry="14" fill="#1f5fc4" opacity="0.45"/>

                    <!-- 装饰植物（左） -->
                    <g opacity="0.85">
                        <path d="M70 268 C 60 220, 66 190, 84 168 C 74 200, 72 235, 78 268 Z" fill="#2e7fd9"/>
                        <path d="M84 268 C 88 226, 100 200, 120 186 C 102 212, 92 240, 90 268 Z" fill="#5aa8ef"/>
                        <path d="M62 268 C 50 238, 48 214, 56 194 C 52 220, 56 246, 68 268 Z" fill="#5aa8ef"/>
                    </g>

                    <!-- 装饰植物（右） -->
                    <g opacity="0.9">
                        <path d="M368 268 C 378 234, 376 210, 362 190 C 370 214, 368 242, 360 268 Z" fill="#2e7fd9"/>
                        <path d="M354 268 C 348 240, 350 218, 362 200 C 354 222, 354 246, 360 268 Z" fill="#5aa8ef"/>
                    </g>

                    <!-- 火箭 -->
                    <g>
                        <!-- 尾焰 -->
                        <path d="M150 232 C 138 252, 138 266, 148 282 C 158 266, 158 252, 150 232 Z" fill="#ff9d4d"/>
                        <path d="M150 240 C 144 254, 144 262, 150 272 C 156 262, 156 254, 150 240 Z" fill="#ffd166"/>
                        <!-- 左尾翼 -->
                        <path d="M132 190 C 112 202, 102 224, 100 246 C 116 238, 130 224, 138 208 Z" fill="#dfe9f5"/>
                        <!-- 右尾翼 -->
                        <path d="M176 202 C 194 210, 204 226, 208 244 C 192 240, 178 228, 170 214 Z" fill="#c3d4e8"/>
                        <!-- 箭身 -->
                        <path d="M154 84 C 128 116, 118 168, 126 224 C 134 244, 168 244, 178 226 C 188 170, 178 116, 154 84 Z" fill="#f4f8fc"/>
                        <!-- 箭身左侧阴影 -->
                        <path d="M154 84 C 138 114, 130 164, 136 222 C 140 236, 152 242, 160 240 C 146 190, 144 130, 154 84 Z" fill="#dde8f3"/>
                        <!-- 舷窗 -->
                        <circle cx="156" cy="150" r="24" fill="#c9d8ea"/>
                        <circle cx="156" cy="150" r="17" fill="#3f96f7"/>
                        <circle cx="150" cy="143" r="5" fill="#a8d4ff" opacity="0.9"/>
                        <!-- 箭头顶部 -->
                        <path d="M154 84 C 146 96, 140 110, 136 126 C 148 118, 164 118, 174 124 C 170 108, 163 94, 154 84 Z" fill="#3f96f7"/>
                    </g>

                    <!-- 盘坐人物 -->
                    <g>
                        <!-- 阴影 -->
                        <ellipse cx="282" cy="272" rx="62" ry="10" fill="#1f5fc4" opacity="0.5"/>
                        <!-- 交叉的腿（深色长裤） -->
                        <path d="M232 258 C 240 240, 262 232, 282 232 C 302 232, 322 240, 330 258 C 320 268, 244 268, 232 258 Z" fill="#3a3f5c"/>
                        <!-- 左脚鞋子 -->
                        <path d="M228 256 C 222 252, 220 258, 224 262 C 230 266, 240 266, 242 262 Z" fill="#20243a"/>
                        <!-- 右脚鞋子 -->
                        <path d="M334 256 C 340 252, 342 258, 338 262 C 332 266, 322 266, 320 262 Z" fill="#20243a"/>
                        <!-- 上身（白衬衫） -->
                        <path d="M258 186 C 250 200, 246 220, 250 240 C 268 248, 296 248, 314 240 C 318 218, 314 200, 306 186 C 290 178, 274 178, 258 186 Z" fill="#f2f5f9"/>
                        <!-- 左臂（捧着笔记本） -->
                        <path d="M260 192 C 250 202, 246 216, 252 228 C 262 234, 276 234, 284 228 L 276 214 C 268 216, 262 212, 260 192 Z" fill="#f2f5f9"/>
                        <!-- 右臂 -->
                        <path d="M304 192 C 314 202, 318 216, 312 228 C 302 234, 288 234, 280 228 L 288 214 C 296 216, 302 212, 304 192 Z" fill="#e4eaf1"/>
                        <!-- 手上的平板/笔记本 -->
                        <rect x="258" y="216" width="48" height="10" rx="3" fill="#2f3a4e" transform="rotate(-6 282 221)"/>
                        <!-- 脖子 -->
                        <rect x="276" y="168" width="12" height="14" rx="5" fill="#e8a98c"/>
                        <!-- 头部 -->
                        <circle cx="282" cy="150" r="22" fill="#f0b394"/>
                        <!-- 头发 -->
                        <path d="M262 146 C 258 128, 272 116, 286 118 C 300 120, 306 132, 304 144 C 296 134, 288 130, 278 132 C 270 134, 264 140, 262 146 Z" fill="#2b2f3e"/>
                        <!-- 后发束 -->
                        <path d="M300 138 C 308 142, 310 154, 306 164 C 302 156, 298 148, 296 142 Z" fill="#2b2f3e"/>
                    </g>
                </svg>
            </div>
        </aside>

        <!-- ============ 右侧登录区 ============ -->
        <main class="panel-right">
            <div class="login-box">
                <form id="loginForm">
                    <h2>Sign in</h2>

                    <div class="input-group">
                        <input type="text" id="username" name="username"
                               autocomplete="username" placeholder="Username" required>
                        <!-- 用户图标 -->
                        <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                        </svg>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" name="password"
                               autocomplete="current-password" placeholder="Password" required>
                        <!-- 锁图标 -->
                        <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0v3H9V7zm3 8a1.5 1.5 0 0 1 .75 2.8V19a.75.75 0 0 1-1.5 0v-1.2A1.5 1.5 0 0 1 12 15z"/>
                        </svg>
                        <span class="toggle-pwd" id="togglePwd">👁️</span>
                    </div>

                    <!-- 记住我选项 -->
                    <div class="remember-group">
                        <label class="remember-label">
                            <input type="checkbox" id="rememberMe" class="remember-checkbox">
                            <span class="remember-text">记住我</span>
                        </label>
                        <a href="#" class="forgot-link">忘记密码？</a>
                    </div>

                    <button type="submit" class="login-btn">LOGIN</button>
                    <div id="loginMessage"></div>
                </form>

                <!-- 社交平台登录 -->
                <div class="social-section">
                    <div class="social-text">Or Sign in with social platforms</div>
                    <div class="social-icons">
                        <a href="#" title="Facebook" aria-label="Facebook">
                            <svg viewBox="0 0 24 24"><path d="M13.5 21v-7.5h2.52l.48-3h-3V8.56c0-.87.24-1.46 1.5-1.46H16.6V4.4c-.28-.04-1.26-.12-2.4-.12-2.37 0-4 1.45-4 4.1v2.12H7.7v3h2.5V21h3.3z"/></svg>
                        </a>
                        <a href="#" title="Twitter" aria-label="Twitter">
                            <svg viewBox="0 0 24 24"><path d="M21.5 6.1c-.7.3-1.4.5-2.2.6.8-.5 1.4-1.2 1.7-2.1-.75.45-1.58.77-2.46.94A3.86 3.86 0 0 0 15.7 4.3c-2.13 0-3.86 1.73-3.86 3.86 0 .3.03.6.1.88-3.2-.16-6.05-1.7-7.95-4.03a3.85 3.85 0 0 0 1.2 5.15c-.63-.02-1.22-.2-1.74-.48v.05c0 1.87 1.33 3.43 3.1 3.79-.32.09-.66.13-1.02.13-.25 0-.5-.02-.73-.07.5 1.54 1.93 2.66 3.63 2.69a7.74 7.74 0 0 1-4.8 1.66c-.3 0-.61-.02-.9-.05a10.9 10.9 0 0 0 5.93 1.74c7.1 0 11-5.9 11-11v-.5c.75-.55 1.4-1.22 1.94-2z"/></svg>
                        </a>
                        <a href="#" title="Google" aria-label="Google">
                            <svg viewBox="0 0 24 24"><path d="M21.35 11.1H12v3.02h5.34c-.23 1.4-1.7 4.1-5.34 4.1a5.9 5.9 0 0 1 0-11.8c1.67 0 2.8.72 3.44 1.33l2.34-2.26C16.3 4.1 14.36 3.2 12 3.2a8.8 8.8 0 1 0 0 17.6c5.08 0 8.44-3.57 8.44-8.6 0-.58-.06-1.02-.15-1.46z" transform="translate(0 -.34)"/></svg>
                        </a>
                        <a href="#" title="LinkedIn" aria-label="LinkedIn">
                            <svg viewBox="0 0 24 24"><path d="M6.94 8.6H3.56V20.4h3.38V8.6zM5.25 3.2a1.96 1.96 0 1 0 0 3.92 1.96 1.96 0 0 0 0-3.92zM20.4 13.28c0-3.24-1.73-4.75-4.04-4.75-1.86 0-2.7 1.03-3.16 1.75V8.6H9.82c.04.96 0 11.8 0 11.8h3.38v-6.6c0-.35.02-.7.13-.95.28-.7.92-1.42 2-1.42 1.4 0 1.97 1.07 1.97 2.65v6.32h3.38l.01-6.47v.35z"/></svg>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 刷新守卫：登录成功时发放一次性票据 -->
    <script src="auth-guard.js"></script>
    <script>
        // 动态登录页面 JS - 修复版 + 自动登录
        (function() {
            'use strict';

            // DOM 元素引用
            const loginForm = document.getElementById('loginForm');
            const loginMessage = document.getElementById('loginMessage');
            const togglePwd = document.getElementById('togglePwd');
            const passwordInput = document.getElementById('password');
            const loginBtn = loginForm.querySelector('.login-btn');
            const rememberMeCheckbox = document.getElementById('rememberMe');

            // ============ 后端数据（backend/users.json） ============
            // 账号数据不再写死在网页源码里，而是从后端数据文件 users.json 读取
            // （部署到公网后自动读取该文件；本地双击直接打开时若读取失败，回退到内置默认账号）
            const CONFIG = {
                redirectUrl: 'app.html',  // 登录成功后跳转到受保护的任务管理页 app.html（可被 users.json 覆盖）
                redirectDelay: 1500,
                storageKey: 'login_remember',
                dataFile: 'backend/users.json'
            };

            // 内置兜底账号（仅在后端数据文件读取失败时使用，例如本地 file:// 方式打开）
            const FALLBACK_USERS = [
                { username: 'ruan', password: 'ruan19941009', role: 'admin' }
            ];

            // 当前生效的后端账号数据（异步加载，随时可在 users.json 里增删账号）
            let backendUsers = FALLBACK_USERS;

            async function loadBackendData() {
                try {
                    const res = await fetch(CONFIG.dataFile, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (Array.isArray(data.users) && data.users.length > 0) {
                        backendUsers = data.users;
                        console.log('✅ 已从后端数据文件加载 ' + data.users.length + ' 个账号');
                    }
                    if (data.config && data.config.redirectUrl) {
                        CONFIG.redirectUrl = data.config.redirectUrl;
                    }
                    if (data.config && typeof data.config.redirectDelay === 'number') {
                        CONFIG.redirectDelay = data.config.redirectDelay;
                    }
                } catch (e) {
                    console.warn('⚠️ 后端数据文件读取失败，使用内置默认账号（本地直接打开时属正常现象）:', e.message);
                }
            }
            loadBackendData();

            // ============ 工具函数 ============

            function showErrorDialog(msg) {
                const oldDialog = document.getElementById('customErrorDialog');
                if (oldDialog) {
                    oldDialog.remove();
                }

                const dialog = document.createElement('div');
                dialog.id = 'customErrorDialog';
                dialog.className = 'dialog-overlay';
                dialog.innerHTML = `
                    <div class="dialog-content">
                        <span class="dialog-close" id="dialogCloseBtn">&times;</span>
                        <div class="dialog-icon">❌</div>
                        <div class="dialog-text">${msg}</div>
                        <button id="dialogOkBtn" class="dialog-btn">确定</button>
                    </div>
                `;

                document.body.appendChild(dialog);

                setTimeout(() => {
                    dialog.classList.add('dialog-show');
                }, 10);

                function closeDialog() {
                    dialog.classList.remove('dialog-show');
                    dialog.classList.add('dialog-hide');
                    setTimeout(() => {
                        if (dialog.parentNode) {
                            dialog.remove();
                        }
                    }, 300);
                }

                document.getElementById('dialogCloseBtn').onclick = closeDialog;
                document.getElementById('dialogOkBtn').onclick = closeDialog;

                dialog.onclick = function(e) {
                    if (e.target === this) {
                        closeDialog();
                    }
                };

                document.addEventListener('keydown', function escHandler(e) {
                    if (e.key === 'Escape') {
                        closeDialog();
                        document.removeEventListener('keydown', escHandler);
                    }
                });
            }

            function setMessage(msg, type) {
                loginMessage.textContent = msg;
                loginMessage.className = type || '';
            }

            function resetLoginButton() {
                loginBtn.textContent = 'LOGIN';
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading', 'success');
            }

            function setLoginButtonLoading() {
                loginBtn.textContent = '验证中...';
                loginBtn.disabled = true;
                loginBtn.classList.add('loading');
            }

            function setLoginButtonSuccess() {
                loginBtn.textContent = '✅ 登录成功';
                loginBtn.disabled = true;
                loginBtn.classList.add('success');
            }

            // ============ 记住我功能 ============

            function saveRememberMe(username, password, remember) {
                if (remember) {
                    const data = {
                        username: username,
                        password: password,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));
                } else {
                    localStorage.removeItem(CONFIG.storageKey);
                }
            }

            function loadRememberMe() {
                try {
                    const data = localStorage.getItem(CONFIG.storageKey);
                    if (data) {
                        const parsed = JSON.parse(data);
                        const sevenDays = 7 * 24 * 60 * 60 * 1000;
                        if (Date.now() - parsed.timestamp < sevenDays) {
                            return parsed;
                        } else {
                            localStorage.removeItem(CONFIG.storageKey);
                            return null;
                        }
                    }
                } catch (e) {
                    console.error('读取记住我失败:', e);
                }
                return null;
            }

            function autoFillLogin() {
                const saved = loadRememberMe();
                if (saved) {
                    const usernameInput = document.getElementById('username');
                    const passwordInput = document.getElementById('password');
                    const rememberCheckbox = document.getElementById('rememberMe');

                    // 只回填账号密码，不自动提交登录
                    // 网页刷新后必须手动点击"登录"重新登录，验证通过才会跳转进入网站
                    if (usernameInput) usernameInput.value = saved.username;
                    if (passwordInput) passwordInput.value = saved.password;
                    if (rememberCheckbox) rememberCheckbox.checked = true;

                    console.log('🔄 检测到记住的账号，已回填，请手动点击登录');
                    setMessage('已回填记住的账号，请点击"LOGIN"重新进入', 'info');
                }
            }

            // ============ 核心登录功能 ============

            function mockLogin(username, password) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        // 从后端数据（backend/users.json）中校验账号密码
                        const found = backendUsers.find(function(u) {
                            return u.username === username && u.password === password;
                        });
                        if (found) {
                            resolve({
                                success: true,
                                message: '登录成功，欢迎 ' + username + '！',
                                user: { username: found.username, role: found.role || 'user' }
                            });
                        } else {
                            resolve({
                                success: false,
                                message: '用户名或密码错误'
                            });
                        }
                    }, 800);
                });
            }

            async function handleLogin(e) {
                e.preventDefault();

                if (loginBtn.disabled) {
                    return;
                }

                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const rememberCheckbox = document.getElementById('rememberMe');

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username) {
                    setMessage('请输入用户名', 'error');
                    showErrorDialog('用户名不能为空');
                    return;
                }

                if (!password) {
                    setMessage('请输入密码', 'error');
                    showErrorDialog('密码不能为空');
                    return;
                }

                setMessage('正在验证...', 'info');
                setLoginButtonLoading();

                try {
                    const result = await mockLogin(username, password);

                    if (result.success) {
                        setMessage(result.message, 'success');
                        setLoginButtonSuccess();

                        const remember = rememberCheckbox ? rememberCheckbox.checked : false;
                        saveRememberMe(username, password, remember);

                        if (result.user) {
                            localStorage.setItem('user', JSON.stringify(result.user));
                        }

                        // 发放一次性登录票据：app.html 会校验并消费它，
                        // 刷新目标页后票据已失效，必须回到这里重新登录
                        if (window.WBAuth) {
                            WBAuth.grant();
                        }

                        setTimeout(() => {
                            window.location.href = CONFIG.redirectUrl;
                        }, CONFIG.redirectDelay);

                    } else {
                        setMessage(result.message, 'error');
                        resetLoginButton();
                        showErrorDialog(result.message);
                    }

                } catch (error) {
                    console.error('登录错误:', error);
                    setMessage('登录失败，请重试', 'error');
                    resetLoginButton();
                    showErrorDialog('网络异常，请检查连接后重试');
                }
            }

            // ============ 事件绑定 ============

            if (togglePwd) {
                togglePwd.addEventListener('click', function() {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        togglePwd.textContent = '🙈';
                        togglePwd.title = '隐藏密码';
                    } else {
                        passwordInput.type = 'password';
                        togglePwd.textContent = '👁️';
                        togglePwd.title = '显示密码';
                    }
                });
            }

            loginForm.addEventListener('submit', handleLogin);

            document.querySelectorAll('.input-group input').forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        loginForm.dispatchEvent(new Event('submit'));
                    }
                });
            });

            // SIGN UP 按钮：注册功能暂未开放，给出友好提示
            const signupBtn = document.getElementById('signupBtn');
            if (signupBtn) {
                signupBtn.addEventListener('click', function() {
                    setMessage('注册功能暂未开放，请联系管理员开通账号', 'info');
                });
            }

            // ============ 初始化 ============

            document.addEventListener('DOMContentLoaded', function() {
                const usernameInput = document.getElementById('username');
                if (usernameInput) {
                    usernameInput.focus();
                }

                autoFillLogin();

                console.log('📝 登录页面已加载');
                console.log('📡 账号数据来源: backend/users.json（后端数据文件）');
                console.log('🔗 跳转地址:', CONFIG.redirectUrl);
                console.log('💡 提示: 网页刷新后需手动重新登录才能跳转');
            });

            const userSession = localStorage.getItem('user');
            if (userSession) {
                try {
                    const userData = JSON.parse(userSession);
                    if (userData.timestamp && Date.now() - userData.timestamp > 30 * 60 * 1000) {
                        localStorage.removeItem('user');
                    }
                } catch (e) {
                    localStorage.removeItem('user');
                }
            }

        })();
    </script>
</body>
</html>
